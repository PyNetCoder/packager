[package]
name = "packager"
version = "2.1.0"
edition = "2024"
rust-version = "1.88"
description = "A cross-platform release packaging CLI for GitHub Release assets"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
bzip2 = "0.6.1"
clap = { version = "4.6.8", features = ["derive"] }
flate2 = "1.1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.1"
tar = "0.4.46"
toml = "0.9"
walkdir = "2.5.0"
xz2 = "0.1.7"
zip = { version = "9.7.0", default-features = false, features = ["deflate"] }
zstd = "0.14.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"